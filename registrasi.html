<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registrasi Ghost</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    color:white;

    background:
        radial-gradient(circle at top,#123b70 0%,transparent 40%),
        linear-gradient(145deg,#050b16,#0b1b31 55%,#07101d);
}

.card{
    width:100%;
    max-width:440px;
    padding:30px 25px;

    border-radius:22px;

    background:rgba(10,25,45,.94);

    border:1px solid rgba(80,150,255,.25);

    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
    display:block;

    width:90px;
    height:90px;

    object-fit:contain;

    border-radius:16px;

    margin:0 auto 18px;
}

h1{
    text-align:center;
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#9eacc0;
    font-size:14px;
    margin-bottom:25px;
}

.discord-box{
    padding:15px;

    border-radius:14px;

    background:#101f35;

    border:1px solid rgba(80,150,255,.2);

    margin-bottom:20px;
}

.discord-name{
    font-weight:bold;
    margin-bottom:5px;
}

.discord-id{
    color:#8293aa;
    font-size:12px;
    word-break:break-all;
}

label{
    display:block;

    font-size:14px;
    font-weight:bold;

    margin-bottom:7px;

    color:#cbd7e8;
}

input{
    width:100%;

    padding:14px;

    border-radius:11px;

    border:1px solid #263e5e;

    outline:none;

    color:white;

    background:#071424;

    margin-bottom:17px;

    font-size:15px;
}

input:focus{
    border-color:#4c8dff;
}

button{
    width:100%;

    border:0;

    border-radius:11px;

    padding:14px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    background:linear-gradient(135deg,#5865f2,#3d7cff);

    margin-top:3px;
}

button:active{
    transform:scale(.98);
}

.discord-button{
    background:#5865f2;
    margin-bottom:10px;
}

.logout{
    background:#18273b;
    color:#aab8ca;
}

#message{
    text-align:center;

    margin-top:17px;

    font-size:14px;

    line-height:1.4;
}

.success{
    color:#5ee59b;
}

.error{
    color:#ff7272;
}

.loading{
    color:#9db8dd;
}
</style>
</head>

<body>

<div class="card">

    <img src="logo.jpg" class="logo" alt="Logo">

    <h1>Registrasi Ghost</h1>

    <div class="subtitle">
        Lengkapi akun Ghost kamu
    </div>

    <div class="discord-box">

        <div class="discord-name" id="discordName">
            Memuat akun Discord...
        </div>

        <div class="discord-id" id="discordId"></div>

    </div>

    <button class="discord-button" id="discordButton">
        Buka Discord
    </button>

    <form id="registerForm">

        <label for="username">
            Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="Masukkan username"
            minlength="3"
            maxlength="20"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Masukkan password"
            minlength="6"
            required
        >

        <label for="confirmPassword">
            Konfirmasi Password
        </label>

        <input
            id="confirmPassword"
            type="password"
            placeholder="Ulangi password"
            minlength="6"
            required
        >

        <button type="submit">
            Buat Akun
        </button>

    </form>

    <button class="logout" id="logout">
        Keluar
    </button>

    <div id="message"></div>

</div>

<script>

const SUPABASE_URL =
    "https://ptkwoqbkqubxnjacobkm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qyC_25w3HLPKnhkPZT4VJg_2RNpyItD";

const DISCORD_SERVER_ID =
    "1547958319346352160";

const DISCORD_INVITE =
    "https://discord.gg/BKTBANfWK";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const discordName =
    document.getElementById("discordName");

const discordId =
    document.getElementById("discordId");

const message =
    document.getElementById("message");


function showMessage(text,type){

    message.textContent = text;

    message.className = type || "";

}


async function loadUser(){

    showMessage(
        "Memeriksa sesi login...",
        "loading"
    );

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if(error){

        showMessage(
            error.message,
            "error"
        );

        return;
    }

    const session = data.session;

    if(!session){

        window.location.replace(
            "./index.html"
        );

        return;
    }

    const user = session.user;

    const metadata =
        user.user_metadata || {};

    const username =
        metadata.full_name ||
        metadata.name ||
        metadata.user_name ||
        "Pengguna Discord";

    discordName.textContent =
        username;

    discordId.textContent =
        "Discord ID: " +
        (metadata.provider_id || user.id);

    showMessage(
        "",
        ""
    );
}


document
.getElementById("registerForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    if(username.length < 3){

        showMessage(
            "Username minimal 3 karakter.",
            "error"
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Password minimal 6 karakter.",
            "error"
        );

        return;
    }


    if(password !== confirmPassword){

        showMessage(
            "Konfirmasi password tidak sama.",
            "error"
        );

        return;
    }


    showMessage(
        "Mendaftarkan akun...",
        "loading"
    );


    const {
        data: sessionData,
        error: sessionError
    } =
        await supabaseClient.auth.getSession();


    if(sessionError || !sessionData.session){

        showMessage(
            "Sesi Discord tidak ditemukan.",
            "error"
        );

        return;
    }


    const user =
        sessionData.session.user;


    // Cek username
    const {
        data: existing,
        error: checkError
    } =
        await supabaseClient
        .from("profiles")
        .select("id")
        .eq("username", username)
        .maybeSingle();


    if(checkError){

        showMessage(
            "Gagal mengecek username: " +
            checkError.message,
            "error"
        );

        return;
    }


    if(existing && existing.id !== user.id){

        showMessage(
            "Username sudah digunakan.",
            "error"
        );

        return;
    }


    // Simpan password
    const {
        error: passwordError
    } =
        await supabaseClient.auth.updateUser({
            password: password
        });


    if(passwordError){

        showMessage(
            "Gagal menyimpan password: " +
            passwordError.message,
            "error"
        );

        return;
    }


    // Simpan profile
    const {
        error: profileError
    } =
        await supabaseClient
        .from("profiles")
        .upsert({
            id: user.id,
            username: username
        });


    if(profileError){

        showMessage(
            "Gagal menyimpan username: " +
            profileError.message,
            "error"
        );

        return;
    }


    showMessage(
        "Registrasi berhasil!",
        "success"
    );

});


document
.getElementById("logout")
.addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    window.location.replace(
        "./index.html"
    );

});


document
.getElementById("discordButton")
.addEventListener("click", () => {

    const discordAppURL =
        "discord://discord.com/channels/" +
        DISCORD_SERVER_ID;

    window.location.href =
        discordAppURL;

    setTimeout(() => {

        window.location.href =
            DISCORD_INVITE;

    },1800);

});


loadUser();

</script>

</body>
</html>
