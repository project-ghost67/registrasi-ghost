<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrasi - Ghost</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #123b72 0%,
                    #071a35 45%,
                    #030b18 100%
                );

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: rgba(7, 25, 50, 0.95);
            border: 1px solid rgba(90, 160, 255, 0.25);
            border-radius: 20px;
            padding: 28px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.45);
        }

        .logo {
            display: block;

            width: 110px;
            height: 110px;

            object-fit: contain;

            margin: 0 auto 18px;

            border-radius: 18px;
        }

        h1 {
            text-align: center;

            font-size: 25px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #9fb6d3;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        .loading {
            text-align: center;

            color: #9fb6d3;

            font-size: 14px;

            padding: 15px 0;
        }

        .hidden {
            display: none !important;
        }

        /* ================================
           DISCORD ACCOUNT
        ================================= */

        .discord-box {
            background: rgba(88, 101, 242, 0.12);

            border: 1px solid rgba(88, 101, 242, 0.35);

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 14px;
        }

        .discord-title {
            color: #aeb8ff;

            font-size: 12px;

            margin-bottom: 6px;
        }

        .discord-user {
            font-size: 15px;

            font-weight: bold;

            word-break: break-word;
        }

        /* ================================
           BUTTON
        ================================= */

        button {
            width: 100%;

            border: none;

            border-radius: 11px;

            padding: 14px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .discord-button {
            background: #5865F2;

            color: white;

            margin-bottom: 10px;
        }

        .discord-button:hover {
            background: #4752c4;
        }

        .register-button {
            background: #1877f2;

            color: white;

            margin-top: 5px;
        }

        .register-button:hover {
            background: #0f65d1;
        }

        .register-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        .logout-button {
            background: transparent;

            color: #8fa9c7;

            border: 1px solid #29496d;

            margin-top: 10px;
        }

        .logout-button:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* ================================
           FORM
        ================================= */

        .divider {
            height: 1px;

            background: #1d3655;

            margin: 20px 0;
        }

        .input-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            font-size: 13px;

            color: #b7c9df;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border-radius: 11px;

            border: 1px solid #29496d;

            background: #07182e;

            color: white;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #4285ff;

            box-shadow:
                0 0 0 2px rgba(66, 133, 255, 0.12);
        }

        input::placeholder {
            color: #647b97;
        }

        /* ================================
           MESSAGE
        ================================= */

        .message {
            display: none;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 15px;

            font-size: 13px;

            line-height: 1.5;
        }

        .error {
            background: rgba(255, 70, 70, 0.10);

            border: 1px solid rgba(255, 70, 70, 0.35);

            color: #ff9b9b;
        }

        .success {
            background: rgba(50, 200, 120, 0.10);

            border: 1px solid rgba(50, 200, 120, 0.35);

            color: #7ff0ae;
        }

        .small-text {
            text-align: center;

            color: #7188a3;

            font-size: 11px;

            line-height: 1.5;

            margin-top: 17px;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- LOGO -->

        <img
            src="logo.jpg"
            class="logo"
            alt="Ghost Logo"
        >


        <h1>Buat Akun</h1>


        <p class="subtitle">
            Lengkapi data akun untuk menyelesaikan registrasi.
        </p>


        <!-- LOADING -->

        <div
            id="loading"
            class="loading"
        >
            Memeriksa akun Discord...
        </div>


        <!-- CONTENT -->

        <div
            id="content"
            class="hidden"
        >

            <!-- ============================
                 DISCORD ACCOUNT
            ============================= -->

            <div class="discord-box">

                <div class="discord-title">
                    AKUN DISCORD
                </div>

                <div
                    id="discordUser"
                    class="discord-user"
                >
                    -
                </div>

            </div>


            <!-- ============================
                 DISCORD SERVER BUTTON
            ============================= -->

            <button
                id="openDiscordButton"
                class="discord-button"
                onclick="openDiscord()"
            >
                Buka Discord
            </button>


            <div class="divider"></div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- ============================
                 REGISTRATION FORM
            ============================= -->

            <form id="registerForm">


                <!-- USERNAME -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        minlength="3"
                        maxlength="20"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Konfirmasi Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Ulangi password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- REGISTER -->

                <button
                    type="submit"
                    id="registerButton"
                    class="register-button"
                >
                    Buat Akun
                </button>


            </form>


            <!-- LOGOUT -->

            <button
                id="logoutButton"
                class="logout-button"
                onclick="logout()"
            >
                Keluar dari Discord
            </button>


            <p class="small-text">
                Password dikelola oleh Supabase Auth.
            </p>

        </div>

    </div>

</div>


<script>

/*
==================================================
SUPABASE CONFIG
==================================================
*/

const SUPABASE_URL =
    "https://PROJECT-KAMU.supabase.co";

const SUPABASE_KEY =
    "PASTE-PUBLISHABLE-KEY-KAMU";


/*
==================================================
DISCORD SERVER CONFIG
==================================================
*/

const DISCORD_SERVER_ID =
    "1547958319346352160";


const DISCORD_INVITE =
    "https://discord.gg/BKTBANfWK";


/*
==================================================
SUPABASE CLIENT
==================================================
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
==================================================
ELEMENT
==================================================
*/

const loading =
    document.getElementById("loading");


const content =
    document.getElementById("content");


const discordUser =
    document.getElementById("discordUser");


const registerForm =
    document.getElementById("registerForm");


const registerButton =
    document.getElementById("registerButton");


const message =
    document.getElementById("message");


/*
==================================================
MESSAGE
==================================================
*/

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


function hideMessage() {

    message.style.display =
        "none";
}


/*
==================================================
CHECK DISCORD SESSION
==================================================
*/

async function checkSession() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if (error) {

            throw error;

        }


        const session =
            data.session;


        /*
        BELUM LOGIN
        */

        if (!session) {

            window.location.href =
                "./index.html";

            return;

        }


        /*
        USER DISCORD
        */

        const user =
            session.user;


        const metadata =
            user.user_metadata || {};


        const discordName =
            metadata.full_name ||
            metadata.name ||
            metadata.preferred_username ||
            metadata.user_name ||
            user.email ||
            "Akun Discord";


        discordUser.textContent =
            discordName;


        /*
        TAMPILKAN FORM
        */

        loading.classList.add(
            "hidden"
        );


        content.classList.remove(
            "hidden"
        );

    }


    catch (error) {

        console.error(error);

        loading.textContent =
            "Gagal memeriksa sesi. Silakan kembali ke halaman login.";

    }

}


/*
==================================================
OPEN DISCORD SERVER
==================================================
*/

function openDiscord() {

    /*
    COBA BUKA APLIKASI DISCORD
    */

    const discordAppURL =
        "discord://discord.com/channels/" +
        DISCORD_SERVER_ID;


    window.location.href =
        discordAppURL;


    /*
    FALLBACK KE INVITE
    */

    setTimeout(function() {

        window.location.href =
            DISCORD_INVITE;

    }, 1800);

}


/*
==================================================
REGISTER
==================================================
*/

registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideMessage();


        /*
        AMBIL INPUT
        */

        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        /*
        VALIDASI USERNAME
        */

        if (username.length < 3) {

            showMessage(
                "Username minimal 3 karakter.",
                "error"
            );

            return;

        }


        if (username.length > 20) {

            showMessage(
                "Username maksimal 20 karakter.",
                "error"
            );

            return;

        }


        /*
        VALIDASI PASSWORD
        */

        if (password.length < 6) {

            showMessage(
                "Password minimal 6 karakter.",
                "error"
            );

            return;

        }


        /*
        CEK PASSWORD
        */

        if (password !== confirmPassword) {

            showMessage(
                "Konfirmasi password tidak sama.",
                "error"
            );

            return;

        }


        /*
        BUTTON LOADING
        */

        registerButton.disabled =
            true;


        registerButton.textContent =
            "Membuat akun...";


        try {

            /*
            ======================================
            GET SESSION
            ======================================
            */

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (sessionError) {

                throw sessionError;

            }


            const session =
                sessionData.session;


            if (!session) {

                throw new Error(
                    "Sesi Discord sudah tidak tersedia."
                );

            }


            const user =
                session.user;


            /*
            ======================================
            CHECK USERNAME
            ======================================
            */

            const {
                data: existingUser,
                error: checkError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("id")
                    .eq("username", username)
                    .maybeSingle();


            if (checkError) {

                throw checkError;

            }


            if (existingUser) {

                throw new Error(
                    "Username tersebut sudah digunakan."
                );

            }


            /*
            ======================================
            SET PASSWORD
            ======================================
            */

            const {
                error: passwordError
            } =
                await supabaseClient
                    .auth
                    .updateUser({

                        password:
                            password

                    });


            if (passwordError) {

                throw passwordError;

            }


            /*
            ======================================
            SAVE PROFILE
            ======================================
            */

            const {
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .upsert({

                        id:
                            user.id,

                        username:
                            username

                    });


            if (profileError) {

                throw profileError;

            }


            /*
            ======================================
            SUCCESS
            ======================================
            */

            showMessage(
                "Registrasi berhasil! Akun lu sudah dibuat.",
                "success"
            );


            registerButton.textContent =
                "Akun Berhasil Dibuat";


            /*
            DISABLE FORM
            */

            document
                .getElementById("username")
                .disabled = true;


            document
                .getElementById("password")
                .disabled = true;


            document
                .getElementById("confirmPassword")
                .disabled = true;

        }


        catch (error) {

            console.error(error);


            showMessage(
                error.message ||
                "Terjadi kesalahan saat membuat akun.",
                "error"
            );


            registerButton.disabled =
                false;


            registerButton.textContent =
                "Buat Akun";

        }

    }
);


/*
==================================================
LOGOUT
==================================================
*/

async function logout() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "./index.html";

}


/*
==================================================
AUTH STATE
==================================================
*/

supabaseClient
    .auth
    .onAuthStateChange(
        function(event, session) {

            if (!session) {

                window.location.href =
                    "./index.html";

            }

        }
    );


/*
==================================================
START
==================================================
*/

checkSession();

</script>

</body>
</html>
