<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrasi Ghost</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(circle at top, #123d78 0%, transparent 45%),
                linear-gradient(135deg, #050b18, #071a33);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 32px 25px;
            border-radius: 22px;
            background: rgba(8, 24, 48, 0.94);
            border: 1px solid rgba(74, 144, 255, 0.25);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aebdd3;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .discord-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .discord-btn:hover {
            background: #4752c4;
            transform: translateY(-1px);
        }

        .discord-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            margin-top: 18px;
            min-height: 20px;
            color: #9eb5d5;
            font-size: 13px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #647896;
        }
    </style>
</head>

<body>

<div class="container">

    <img src="logo.jpg" class="logo" alt="Logo">

    <h1>Registrasi Ghost</h1>

    <p class="subtitle">
        Login menggunakan akun Discord untuk melanjutkan proses registrasi.
    </p>

    <button id="discordLogin" class="discord-btn">
        Login dengan Discord
    </button>

    <div id="status" class="status"></div>

    <div class="footer">
        Registrasi Ghost
    </div>

</div>

<script>
    // ==============================
    // SUPABASE CONFIG
    // ==============================

    const SUPABASE_URL =
        "https://ptkwobkqubxgnjacobkm.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_qyC_25w3HLPKnhkPZT4VJg_2RNpyItD";


    // ==============================
    // BUAT CLIENT SUPABASE
    // ==============================

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==============================
    // ELEMENT
    // ==============================

    const loginButton =
        document.getElementById("discordLogin");

    const statusText =
        document.getElementById("status");


    // ==============================
    // LOGIN DISCORD
    // ==============================

    loginButton.addEventListener("click", async () => {

        try {

            loginButton.disabled = true;

            statusText.textContent =
                "Menghubungkan ke Discord...";


            // Halaman setelah OAuth berhasil
            const redirectUrl =
                window.location.origin +
                "/registrasi-ghost/registrasi.html";


            const { data, error } =
                await supabaseClient.auth.signInWithOAuth({

                    provider: "discord",

                    options: {
                        redirectTo: redirectUrl
                    }

                });


            if (error) {

                console.error(error);

                statusText.textContent =
                    "Login gagal: " + error.message;

                loginButton.disabled = false;

                return;
            }


            console.log("OAuth dimulai:", data);


        } catch (error) {

            console.error(error);

            statusText.textContent =
                "Terjadi kesalahan: " + error.message;

            loginButton.disabled = false;

        }

    });


    // ==============================
    // CEK SESSION
    // ==============================

    async function checkSession() {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();


        if (session) {

            // Kalau sudah login,
            // langsung ke halaman registrasi

            window.location.href =
                "/registrasi-ghost/registrasi.html";
        }

    }


    checkSession();

</script>

</body>
</html>
