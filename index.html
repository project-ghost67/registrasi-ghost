<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registrasi Ghost</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;
    color:white;

    background:
        radial-gradient(
            circle at top,
            rgba(0,140,255,.25),
            transparent 40%
        ),
        linear-gradient(
            145deg,
            #020812,
            #071a2d,
            #020812
        );
}

.card{
    width:100%;
    max-width:520px;

    padding:32px 25px;

    background:rgba(5,18,32,.95);

    border:1px solid rgba(0,160,255,.3);

    border-radius:24px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.6),
        0 0 30px rgba(0,130,255,.08);
}

.brand{
    text-align:center;
}

.logo{
    width:110px;
    height:110px;

    margin:0 auto 20px;

    border-radius:24px;

    overflow:hidden;

    border:2px solid #159fff;

    box-shadow:
        0 0 30px rgba(0,150,255,.4);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    margin:0;

    font-size:32px;

    background:
        linear-gradient(
            90deg,
            white,
            #59c7ff
        );

    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    color:#91a7bb;
    margin:10px 0 25px;
}

.discord{
    width:100%;
    height:55px;

    border:0;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #3f4bd8
        );

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

.discord:hover{
    filter:brightness(1.1);
}

.notice{
    text-align:center;

    color:#73889c;

    font-size:13px;

    line-height:1.5;

    margin:18px 5px 25px;
}

.status{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:13px;
}

.error{
    background:rgba(255,50,50,.1);

    border:1px solid rgba(255,50,50,.3);

    color:#ffaaaa;
}
</style>
</head>

<body>

<div class="card">

    <div class="brand">

        <div class="logo">
            <img src="logo.jpg" alt="Ghost Logo">
        </div>

        <h1>
            Registrasi Ghost
        </h1>

        <div class="subtitle">
            Login dengan Discord
        </div>

    </div>


    <button
        class="discord"
        id="discordButton"
        onclick="loginDiscord()"
    >
        Login dengan Discord
    </button>


    <p class="notice">
        Login menggunakan akun Discord
        untuk melanjutkan registrasi.
    </p>


    <div
        class="status error"
        id="error"
    ></div>

</div>


<script>

/*
==================================================
SUPABASE
==================================================

GANTI DENGAN DATA PROJECT SUPABASE LU
==================================================
*/

const SUPABASE_URL =
"https://PROJECT-KAMU.supabase.co";

const SUPABASE_KEY =
"PASTE-PUBLISHABLE-KEY-KAMU";


/*
==================================================
SUPABASE CLIENT
==================================================
*/

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/*
==================================================
LOGIN DISCORD
==================================================
*/

async function loginDiscord(){

    const button =
        document.getElementById(
            "discordButton"
        );


    button.disabled = true;

    button.textContent =
        "Membuka Discord...";


    /*
    Setelah OAuth selesai,
    Discord/Supabase akan kembali
    langsung ke registrasi.html
    */

    const redirectUrl =
        window.location.origin +
        "/registrasi-ghost/registrasi.html";


    const {
        error
    } =
    await supabaseClient.auth.signInWithOAuth({

        provider:"discord",

        options:{

            redirectTo:
                redirectUrl

        }

    });


    if(error){

        button.disabled = false;

        button.textContent =
            "Login dengan Discord";


        const errorBox =
            document.getElementById(
                "error"
            );


        errorBox.textContent =
            error.message;


        errorBox.style.display =
            "block";

    }

}

</script>

</body>
</html>
