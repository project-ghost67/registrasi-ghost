<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrasi Ghost</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
    background:
        radial-gradient(circle at top,#123b70 0%,transparent 40%),
        linear-gradient(145deg,#050b16,#0b1b31 55%,#07101d);
}

.card{
    width:100%;
    max-width:430px;
    padding:35px 25px;
    border-radius:22px;
    text-align:center;
    background:rgba(10,25,45,.92);
    border:1px solid rgba(80,150,255,.25);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
    width:110px;
    height:110px;
    object-fit:contain;
    border-radius:18px;
    margin-bottom:20px;
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

p{
    color:#aebbd0;
    line-height:1.5;
    margin-bottom:25px;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#5865f2,#3d7cff);
}

button:active{
    transform:scale(.98);
}

#status{
    margin-top:15px;
    font-size:14px;
    color:#9fb5d5;
}
</style>
</head>

<body>

<div class="card">

    <img src="logo.jpg" class="logo" alt="Logo">

    <h1>Registrasi Ghost</h1>

    <p>
        Login menggunakan akun Discord untuk melanjutkan
        proses registrasi.
    </p>

    <button id="discordLogin">
        Login dengan Discord
    </button>

    <div id="status"></div>

</div>

<script>
const SUPABASE_URL =
    "https://ptkwoqbkqubxnjacobkm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qyC_25w3HLPKnhkPZT4VJg_2RNpyItD";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const statusText = document.getElementById("status");

document.getElementById("discordLogin").addEventListener("click", async () => {

    statusText.textContent = "Menghubungkan ke Discord...";

    const redirectUrl =
        window.location.origin +
        "/registrasi-ghost/registrasi.html";

    const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "discord",
        options: {
            redirectTo: redirectUrl
        }
    });

    if(error){
        console.error(error);
        statusText.textContent =
            "Gagal login: " + error.message;
    }

});
</script>

</body>
</html>
